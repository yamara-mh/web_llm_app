<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIアシスタントのデモ</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
</head>
<body id="root">
    <div id="chat-container" class="container">
        <div class="card mb-3">
            <div id="chat-messages" class="card-body"></div>
        </div>
    </div>
    <div id="bottom">
        <div class="input-group">
            <input type="text" id="message-input" placeholder="メッセージを入力" class="form-control">
        </div>
        <div class="input-group">
            <button id="mic-button" class="btn btn-secondary">
                <img id="mic-button-image" class="button-icon" src="images/mic_off_icon.png">
            </button>
            <button id="ai-button" class="btn btn-secondary">
                <img id="ai-button-image" class="button-icon" src="images/ai_off_icon.png">
            </button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz" crossorigin="anonymous"></script>
    <script src="js/app.js"></script>
    <script src="js/speech-recognition.js"></script>
    <script src="js/llm.js"></script>
    <script src="js/speak.js"></script>
</body>
</html>
