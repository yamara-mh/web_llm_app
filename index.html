<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIアシスタントのデモ</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
    <script type="importmap">
        {
            "imports": {
                "@google/generative-ai": "https://esm.run/@google/generative-ai"
            }
        }
    </script>
</head>
<body id="root">
    <div id="chat-frame" class="container"></div>
    <div id="top">
        <button id="settings-button" class="btn btn-secondary">
            <img id="settings-button-image" class="button-icon" src="images/settings_icon.png">
        </button>
    </div>
    <div id="bottom">
        <div class="input-group">
            <input type="text" id="message-input" placeholder="メッセージを入力" class="form-control">
        </div>
        <div class="input-group">
            <button id="mic-button" class="btn btn-secondary">
                <img id="mic-button-image" class="button-icon" src="images/mic_off_icon.png">
            </button>
            <button id="ai-button" class="btn btn-secondary">
                <img id="ai-button-image" class="button-icon" src="images/ai_off_icon.png">
            </button>
        </div>
    </div>

    <div id="settings-modal" class="modal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h1 class="modal-title">設定</h1>
                </div>
                <div class="modal-body">
                    <h2>言語モデル</h2>
                    <div class="mb-3">
                        <label for="model-select" class="form-label">利用する言語モデル</label>
                        <select id="model-select" class="form-select"></select>
                    </div>
                    <div class="mb-3 form-check form-switch">
                        <input class="form-check-input" type="checkbox" role="switch" id="latest-model-checkbox">
                        <label class="form-check-label" for="latest-model-checkbox">最新版を優先して利用する</label>
                    </div>
                    <div class="mb-3">
                        <label for="api-key-input" class="form-label">Gemini API キー</label>
                        <input type="text" id="api-key-input" class="form-control" placeholder="APIキーを入力">
                        <button type="button" class="btn btn-secondary" onclick="window.open('https://aistudio.google.com/apikey')" aria-label="APIキーを取得するページを開く">APIキーを取得するページを開く</button>
                    </div>

                    <h2 class="border-top">UI</h2>
                    <div class="mb-3">
                        <label for="font-size-slider" class="form-label">文字サイズ</label>
                        <div class="slider-container">
                            <p class="slider-minmax-label" style="font-size: 16px;">A</p>
                            <input type="range" id="font-size-slider" class="form-range" min="16" max="40"  step="2" value="20">
                            <p class="slider-minmax-label" style="font-size: 40px;">A</p>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="speech-language-select" class="form-label">聞き取り言語</label>
                        <select id="speech-language-select" class="form-select">
                            <option value="ja-JP">日本語</option>
                            <option value="en-US">English (US)</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <div class="slider-container">
                            <label for="wait-voice-input-slider" class="settings-slider-label">音声入力待機秒数</label>
                            <label id="wait-voice-input-value" for="wait-voice-input-slider"    class="settings-slider-value-label"></label>
                        </div>
                        <div class="slider-container">
                            <p class="slider-minmax-label">0.5</p>
                            <input type="range" id="wait-voice-input-slider" class="form-range" min="0.5" max="2.0"  step="0.1" value="0.8">
                            <p class="slider-minmax-label">2.0</p>
                        </div>
                    </div>
                
                    <h2 class="border-top">音声</h2>
                    <div class="mb-3">
                        <label for="voice-select" class="form-label">声の種類</label>
                        <select id="voice-select" class="form-select">
                        </select>
                    </div>
                    <div class="mb-3">
                        <div class="slider-container">
                            <label for="speech-speed-slider" class="settings-slider-label">速度</label>
                            <label id="speech-speed-value" for="speech-speed-slider"    class="settings-slider-value-label"></label>
                        </div>
                        <div class="slider-container">
                            <p class="slider-minmax-label">0.1</p>
                            <input type="range" id="speech-speed-slider" class="form-range" min="0.1" max="10"  step="0.1" value="1">
                            <p class="slider-minmax-label">10.0</p>
                        </div>
                    </div>
                    <div class="mb-3">
                        <div class="slider-container">
                            <label for="speech-pitch-slider" class="settings-slider-label">高さ</label>
                            <label id="speech-pitch-value" for="speech-pitch-slider"    class="settings-slider-value-label"></label>
                        </div>
                        <div class="slider-container">
                            <p class="slider-minmax-label">0.0</p>
                            <input type="range" id="speech-pitch-slider" class="form-range" min="0" max="2" step="0.1" value="1">
                            <p class="slider-minmax-label">2.0</p>
                        </div>
                    </div>
                    <div class="mb-3">
                        <div class="slider-container">
                            <label for="speech-volume-slider" class="settings-slider-label">音量</label>
                            <label id="speech-volume-value" for="speech-volume-slider"  class="settings-slider-value-label"></label>
                        </div>
                        <div class="slider-container">
                            <p class="slider-minmax-label">0.0</p>
                            <input type="range" id="speech-volume-slider" class="form-range" min="0" max="1"    step="0.1" value="1">
                            <p class="slider-minmax-label">1.0</p>
                        </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" aria-label="キャンセル">キャンセル</button>
                
                <button type="button" id="save-settings-button" class="btn btn-primary" data-bs-dismiss="modal" aria-label="保存">保存して適応</button>
            </div>
        </div>
    </div>

    <div id="message-toast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
        <div class="toast-body">
            ここにエラーメッセージなどを表示
            <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="閉じる"></button>
        </div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz" crossorigin="anonymous"></script>
    <script type="module" src="js/chat.js"></script>
    <script type="module" src="js/agent.js"></script>
    <script type="module" src="js/llm.js"></script>
    <script type="module" src="js/speech-recognition.js"></script>
    <script type="module" src="js/speak.js"></script>
    <script src="js/settings.js"></script>
</body>
</html>
